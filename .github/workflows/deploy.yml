# 按 Vite 官方文档编写的 GitHub Pages 部署工作流
# https://vitejs.dev/guide/static-deploy#github-pages
name: Deploy static content to Pages

on:
  # 推送到 main 分支时自动运行
  push:
    branches: ['main']
  # 允许在仓库 Actions 页面手动触发
  workflow_dispatch:

# 部署到 GitHub Pages 所需的 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务在跑
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传构建产物 dist 目录
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4